apiVersion: v1
kind: Service
metadata:
  name: servers-mongodb-1
  namespace: microservices-lab
spec:
  selector:
    app: servers-mongodb-1
  ports:
  - port: 27017
    targetPort: 27017
  clusterIP: None  # Headless service для StatefulSet
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: servers-mongodb-1
  namespace: microservices-lab
  labels:
    app: servers-mongodb-1
spec:
  serviceName: servers-mongodb-1
  replicas: 1
  selector:
    matchLabels:
      app: servers-mongodb-1
  template:
    metadata:
      labels:
        app: servers-mongodb-1
    spec:
     
      securityContext:
        fsGroup: 999
      initContainers:
      - name: cleanup-lock
        image: busybox:1.35
        # Безопасная очистка lock файлов - удаляем только если они есть
        command: ['sh', '-c', 'rm -f /data/db/mongod.lock /data/db/WiredTiger.lock 2>/dev/null || true; echo "Lock files cleaned (if existed)"']
        volumeMounts:
        - name: mongo-data
          mountPath: /data/db
      containers:
      - name: servers-mongodb-1
        image: mongo:latest
        securityContext:
          runAsUser: 999
          runAsGroup: 999
        ports:
        - containerPort: 27017
        volumeMounts:
        - name: mongo-data
          mountPath: /data/db
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          tcpSocket:
            port: 27017
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 27017
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
  volumeClaimTemplates:
  - metadata:
      name: mongo-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: standard
      resources:
        requests:
          storage: 1Gi
