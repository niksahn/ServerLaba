            "y": 8
          },
          "id": 5,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "single"
            }
          },
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{namespace=\"microservices-lab\"}) / sum(kube_pod_container_resource_requests{namespace=\"microservices-lab\", resource=\"memory\"}) * 100",
              "refId": "A",
              "legendFormat": "Memory Usage %"
            }
          ],
          "title": "Cluster Memory Usage",
          "type": "timeseries"
        }
