          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"microservices-lab\"}[5m])) / sum(kube_pod_container_resource_requests{namespace=\"microservices-lab\", resource=\"cpu\"}) * 100",
