apiVersion: apps/v1
kind: Deployment
metadata:
  name: servers-authservice-3
  namespace: microservices-lab
  labels:
    app: servers-authservice-1
    version: v3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: servers-authservice-1
      version: v3
  template:
    metadata:
      labels:
        app: servers-authservice-1
        version: v3
    spec:
      initContainers:
      - name: wait-for-mongodb
        image: busybox:1.35
        command: ['sh', '-c', 'until nc -z servers-mongodb-1 27017; do echo waiting for mongodb; sleep 2; done;']
      containers:
      - name: servers-authservice-3
        image: servers-authservice:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8010
        env:
        - name: ASPNETCORE_URLS
          value: "http://+:8010"
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: ASPNETCORE_ENVIRONMENT
        - name: ConnectionStrings__MongoDbConnection
          value: "mongodb://servers-mongodb-1:27017"
        - name: ConnectionStrings__UserService
          value: "http://servers-user-service-1:8070/"
        resources:
          requests:
            memory: "512Mi"
            cpu: "400m"
          limits:
            memory: "1Gi"
            cpu: "800m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8010
          initialDelaySeconds: 90
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8010
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3


