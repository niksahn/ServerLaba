apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: microservices-lab
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'authservice'
        static_configs:
        - targets:
          - 'servers-authservice-1:8010'
          labels:
            job: authservice
            pod: servers-authservice-1
            instance: servers-authservice-1
        - targets:
          - 'servers-authservice-2:8010'
          labels:
            job: authservice
            pod: servers-authservice-2
            instance: servers-authservice-2
        - targets:
          - 'servers-authservice-3:8010'
          labels:
            job: authservice
            pod: servers-authservice-3
            instance: servers-authservice-3
        metrics_path: /metrics
        scrape_interval: 15s

      - job_name: 'user-service'
        static_configs:
        - targets:
          - 'servers-user-service-1:8070'
          labels:
            job: user-service
            pod: servers-user-service-1
            instance: servers-user-service-1
        - targets:
          - 'servers-user-service-2:8070'
          labels:
            job: user-service
            pod: servers-user-service-2
            instance: servers-user-service-2
        - targets:
          - 'servers-user-service-3:8070'
          labels:
            job: user-service
            pod: servers-user-service-3
            instance: servers-user-service-3
        metrics_path: /metrics
        scrape_interval: 15s

      - job_name: 'app-service'
        static_configs:
        - targets:
          - 'servers-app-1:8080'
          labels:
            job: app-service
            pod: servers-app-1
            instance: servers-app-1
        - targets:
          - 'servers-app-2:8080'
          labels:
            job: app-service
            pod: servers-app-2
            instance: servers-app-2
        - targets:
          - 'servers-app-3:8080'
          labels:
            job: app-service
            pod: servers-app-3
            instance: servers-app-3
        metrics_path: /metrics
        scrape_interval: 15s

      - job_name: 'api-gateway'
        metrics_path: /metrics
        scrape_interval: 15s
        static_configs:
          - targets: ['api-gateway:4040']

      # Kubernetes API Server
      - job_name: 'kubernetes-apiservers'
        kubernetes_sd_configs:
        - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
        - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
          action: keep
          regex: default;kubernetes;https

      # Kubernetes Nodes (cAdvisor metrics)
      - job_name: 'kubernetes-nodes'
        kubernetes_sd_configs:
        - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
        - action: labelmap
          regex: __meta_kubernetes_node_label_(.+)
        - target_label: __address__
          replacement: kubernetes.default.svc:443
        - source_labels: [__meta_kubernetes_node_name]
          regex: (.+)
          target_label: __metrics_path__
          replacement: /api/v1/nodes/${1}/proxy/metrics

      # Kubernetes cAdvisor (container metrics)
      - job_name: 'kubernetes-cadvisor'
        kubernetes_sd_configs:
        - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
        - action: labelmap
          regex: __meta_kubernetes_node_label_(.+)
        - target_label: __address__
          replacement: kubernetes.default.svc:443
        - source_labels: [__meta_kubernetes_node_name]
          regex: (.+)
          target_label: __metrics_path__
          replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
        - source_labels: [__meta_kubernetes_node_name]
          target_label: node

      # Kubernetes Pods
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
        - role: pod
        relabel_configs:
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
          action: keep
          regex: true
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
          action: replace
          target_label: __metrics_path__
          regex: (.+)
        - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
          action: replace
          regex: ([^:]+)(?::\d+)?;(\d+)
          replacement: $1:$2
          target_label: __address__
        - action: labelmap
          regex: __meta_kubernetes_pod_label_(.+)
        - source_labels: [__meta_kubernetes_namespace]
          action: replace
          target_label: kubernetes_namespace
        - source_labels: [__meta_kubernetes_pod_name]
          action: replace
          target_label: kubernetes_pod_name
        - source_labels: [__meta_kubernetes_pod_node_name]
          action: replace
          target_label: kubernetes_node

      # Kubernetes Services
      - job_name: 'kubernetes-services'
        kubernetes_sd_configs:
        - role: service
        metrics_path: /probe
        params:
          module: [http_2xx]
        relabel_configs:
        - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_probe]
          action: keep
          regex: true
        - source_labels: [__address__]
          target_label: __param_target
        - target_label: __address__
          replacement: blackbox-exporter:9115
        - source_labels: [__param_target]
          target_label: instance
        - action: labelmap
          regex: __meta_kubernetes_service_label_(.+)
        - source_labels: [__meta_kubernetes_namespace]
          target_label: kubernetes_namespace
        - source_labels: [__meta_kubernetes_service_name]
          target_label: kubernetes_name

      # Kube State Metrics
      - job_name: 'kube-state-metrics'
        static_configs:
        - targets: ['kube-state-metrics:8080']
        scrape_interval: 30s
        metrics_path: /metrics

      # Nginx metrics via nginx-prometheus-exporter
      - job_name: 'nginx'
        static_configs:
        - targets: ['nginx-prometheus-exporter:9113']
        scrape_interval: 15s
        metrics_path: /metrics

      # Nginx log metrics via Telegraf
      - job_name: 'nginx-logs'
        static_configs:
        - targets: ['nginx:9273']
        scrape_interval: 15s
        metrics_path: /metrics

