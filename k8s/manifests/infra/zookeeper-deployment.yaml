apiVersion: apps/v1
kind: Deployment
metadata:
  name: servers-zookeeper-1
  namespace: microservices-lab
  labels:
    app: servers-zookeeper-1
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: servers-zookeeper-1
  template:
    metadata:
      labels:
        app: servers-zookeeper-1
    spec:
      containers:
      - name: servers-zookeeper-1
        image: confluentinc/cp-zookeeper:latest
        ports:
        - containerPort: 2181
        env:
        - name: ZOOKEEPER_CLIENT_PORT
          value: "2181"
        - name: ZOOKEEPER_TICK_TIME
          value: "2000"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "400m"
        livenessProbe:
          tcpSocket:
            port: 2181
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 2181
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: servers-zookeeper-1
  namespace: microservices-lab
spec:
  selector:
    app: servers-zookeeper-1
  ports:
  - port: 2181
    targetPort: 2181
  type: ClusterIP

