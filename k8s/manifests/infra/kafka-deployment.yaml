apiVersion: apps/v1
kind: Deployment
metadata:
  name: servers-kafka-1
  namespace: microservices-lab
  labels:
    app: servers-kafka-1
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: servers-kafka-1
  template:
    metadata:
      labels:
        app: servers-kafka-1
    spec:
      initContainers:
      - name: wait-for-zookeeper
        image: busybox:1.35
        command: ['sh', '-c', 'until nc -z servers-zookeeper-1 2181; do echo waiting for zookeeper; sleep 2; done;']
      containers:
      - name: servers-kafka-1
        image: confluentinc/cp-kafka:7.3.3
        ports:
        - containerPort: 9092
        env:
        - name: KAFKA_BROKER_ID
          value: "1"
        - name: KAFKA_ZOOKEEPER_CONNECT
          value: "servers-zookeeper-1:2181"
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "PLAINTEXT://servers-kafka-1:9092"
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: "PLAINTEXT:PLAINTEXT"
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "1"
        resources:
          requests:
            memory: "512Mi"
            cpu: "300m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          tcpSocket:
            port: 9092
          initialDelaySeconds: 120
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 9092
          initialDelaySeconds: 90
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: servers-kafka-1
  namespace: microservices-lab
spec:
  selector:
    app: servers-kafka-1
  ports:
  - port: 9092
    targetPort: 9092
  type: ClusterIP

